<script>
  // Lets the parent page (your Next.js site) tell this same-origin
  // iframe "here are the tracking values" without needing Zoho to
  // support URL prefill at all. See postMessage listener below.
  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'bigin-prefill') return;
    var data = event.data.payload || {};
    var map = {
      leadPageUrl: 'POTENTIALCF4',
      utmSource: 'POTENTIALCF5',
      utmCampaign: 'POTENTIALCF7',
      utmContent: 'POTENTIALCF6',
    };
    Object.keys(map).forEach(function (key) {
      var value = data[key];
      if (!value) return;
      var el = document.querySelector('[name="' + map[key] + '"]');
      if (el) el.value = value;
    });
    // Tell the parent we're done, so it can stop retrying.
    if (window.parent) {
      window.parent.postMessage({ type: 'bigin-prefill-ack' }, '*');
    }
  });

  // As soon as this document itself is ready, ask the parent (if any)
  // to send the prefill values — covers the case where the parent
  // posted the message before this iframe finished attaching its
  // listener above.
  document.addEventListener('DOMContentLoaded', function () {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'bigin-ready' }, '*');
    }
  });
</script>

<script>
  // Fills the hidden `returnURL` field right before Zoho's own submit
  // handler runs, so a successful enquiry redirects to THIS site's own
  // /thank-you page instead of Zoho's default response — e.g.
  //   https://21fiftyone.com/thank-you?name=Jishnu+Mindstory&service=Visual+Production&from=banner
  // Because this file is served same-origin from the Next.js site,
  // window.location.origin is already localhost:3000 in dev and
  // 21fiftyone.com in production, so nothing here needs to change
  // between environments.
  (function () {
    var FORM_ID = 'BiginWebToRecordForm7522188000000639254';

    function urlEncode(value) {
      // application/x-www-form-urlencoded style: spaces as "+"
      return encodeURIComponent(value || '').replace(/%20/g, '+');
    }

    function buildReturnUrl(form) {
      var nameField = form.elements['Potential Name'];
      var serviceField = form.elements['POTENTIALCF1'];
      var name = nameField ? nameField.value.trim() : '';
      var service = serviceField ? serviceField.value.trim() : '';
      var query =
        'name=' + urlEncode(name) +
        '&service=' + urlEncode(service) +
        '&from=banner';
      return window.location.origin + '/thank-you?' + query;
    }

    var form = document.getElementById(FORM_ID);
    if (form) {
      form.addEventListener('submit', function () {
        var returnUrlField = form.elements['returnURL'];
        if (returnUrlField) {
          returnUrlField.value = buildReturnUrl(form);
        }
      });
    }
  })();
</script>
